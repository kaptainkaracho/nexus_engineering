packages:
  - "apps/*"
  - "packages/*"
  - "packages/eslint-config"
allowBuilds:
  bcrypt: true
  esbuild: set this to true or false
pnpm:
  # Allowlist of dependencies permitted to run install/build scripts (native modules).
  # better-sqlite3 needs its native binding compiled; esbuild ships a native binary.
  onlyBuiltDependencies:
    - better-sqlite3
    - esbuild

nexus:
  schema: req-doc/v1
  metadata:
    domain: Authentication
    version: 1.0.0
    source: docs/requirements/auth/user-auth.req.yaml
    author: BackendArchitect
    createdAt: "2026-07-18"

requirements:
  - id: REQ-AUTH-001
    type: functional
    title: User Registration with Email/Password
    description: |
      The system MUST allow a new user to register with an email address
      and password. Passwords must be hashed with bcrypt. Email must be
      unique and case-insensitive.
    priority: critical
    status: approved
    tags:
      - auth
      - security
    acceptanceCriteria:
      - "Given an unregistered email, when a user submits registration, then an account is created"
      - "Given a registered email, when a user submits registration, then an error is returned"
      - "Given a registration request, when the password is less than 8 characters, then it is rejected"
    relatedIssues:
      - THE-191

  - id: REQ-AUTH-002
    type: functional
    title: User Login
    description: |
      Registered users MUST be able to log in with their email and password.
      Successful login returns a JWT access token and refresh token.
    priority: critical
    status: approved
    tags:
      - auth
      - security
    acceptanceCriteria:
      - "Given valid credentials, when a user logs in, then a JWT token pair is returned"
      - "Given invalid password, when a user attempts login, then an error is returned"
      - "Given an unregistered email, when login is attempted, then an error is returned"
    dependencies:
      - REQ-AUTH-001
    relatedIssues:
      - THE-191

  - id: REQ-AUTH-003
    type: functional
    title: Role-Based Access Control
    description: |
      Users MUST have roles (admin, editor, viewer) that determine their
      permissions. Routes and API endpoints MUST enforce role-based access.
    priority: high
    status: approved
    tags:
      - auth
      - rbac
    acceptanceCriteria:
      - "Given an admin user, when they access admin endpoints, then access is granted"
      - "Given a viewer user, when they access admin endpoints, then access is denied"
      - "Given a user, when their role changes, then permissions update immediately"
    relatedIssues:
      - THE-191

  - id: REQ-AUTH-004
    type: functional
    title: Organization Management
    description: |
      The system MUST support multi-tenant organizations. Users belong to
      organizations. Organization admins can manage members and roles.
    priority: high
    status: approved
    tags:
      - auth
      - org
    acceptanceCriteria:
      - "Given an org admin, when they invite a user, then the user becomes a member"
      - "Given an org admin, when they remove a member, then access is revoked"
      - "Given a user, when they view their org, then they see all members"
    relatedIssues:
      - THE-191

  - id: REQ-AUTH-005
    type: non-functional
    title: Session Management with JWT
    description: |
      Sessions MUST use short-lived access tokens (15 min) with refresh
      token rotation. Expired tokens must be rejected with 401.
    priority: high
    status: approved
    tags:
      - auth
      - security
    acceptanceCriteria:
      - "Given an expired access token, when a request is made, then 401 is returned"
      - "Given a valid refresh token, when requested, then a new token pair is issued"
      - "Given a revoked refresh token, when used, then the session is terminated"
    dependencies:
      - REQ-AUTH-001
      - REQ-AUTH-002
    relatedIssues:
      - THE-191

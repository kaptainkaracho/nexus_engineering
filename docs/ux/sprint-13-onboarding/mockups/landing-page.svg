  <text x="600" y="180" text-anchor="middle" class="text-primary" font-size="42" font-weight="700">Engineering Intelligence</text>
  <text x="600" y="225" text-anchor="middle" class="text-primary" font-size="42" font-weight="700">for the Modern Enterprise</text>

  <text x="600" y="270" text-anchor="middle" class="text-secondary" font-size="16">Connect your tools, trace requirements to deployments,</text>
  <text x="600" y="292" text-anchor="middle" class="text-secondary" font-size="16">and ship with confidence.</text>


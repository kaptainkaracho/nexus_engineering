<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .bg-surface { fill: #FFFFFF; }
      .bg-secondary { fill: #F8FAFC; }
      .bg-primary-50 { fill: #EFF6FF; }
      .bg-primary-100 { fill: #DBEAFE; }
      .bg-primary-500 { fill: #3B82F6; }
      .bg-primary-950 { fill: #172554; }
      .bg-border { fill: #E2E8F0; }
      .bg-success-500 { fill: #22C55E; }
      .text-primary { fill: #0F172A; }
      .text-secondary { fill: #475569; }
      .text-tertiary { fill: #94A3B8; }
      .text-inverse { fill: #FFFFFF; }
      .text-primary-500 { fill: #3B82F6; }
      .text-primary-600 { fill: #2563EB; }

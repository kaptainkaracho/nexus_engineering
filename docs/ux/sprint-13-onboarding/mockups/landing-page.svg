  <text x="600" y="1545" text-anchor="middle" class="text-tertiary" font-size="11">© 2026 Nexus Engineering. All rights reserved.</text>

  <!-- Section labels -->
  <text x="32" y="1560" class="text-tertiary" font-size="11">Section: Hero</text>
  <text x="32" y="1575" class="text-tertiary" font-size="11">Section: Features</text>
  <text x="32" y="1590" class="text-tertiary" font-size="11">Section: Stats + CTA + Footer</text>

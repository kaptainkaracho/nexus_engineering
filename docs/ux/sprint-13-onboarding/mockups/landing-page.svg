  <rect x="1010" y="14" width="80" height="36" rx="8" stroke="#E2E8F0" stroke-width="1" fill="#FFFFFF"/>
  <text x="1050" y="37" text-anchor="middle" class="text-secondary" font-size="13" font-weight="500">Sign In</text>

  <rect x="1100" y="14" width="80" height="36" rx="8" fill="#3B82F6"/>
  <text x="1140" y="37" text-anchor="middle" class="text-inverse" font-size="13" font-weight="600">Get Started</text>


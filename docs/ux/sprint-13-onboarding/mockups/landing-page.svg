  <text x="32" y="38" class="text-primary" font-size="18" font-weight="700">Nexus</text>
  <text x="160" y="38" class="text-secondary" font-size="13" font-weight="500">Product</text>
  <text x="260" y="38" class="text-secondary" font-size="13" font-weight="500">Discovery</text>
  <text x="370" y="38" class="text-secondary" font-size="13" font-weight="500">Projects</text>
  <text x="480" y="38" class="text-secondary" font-size="13" font-weight="500">Pricing</text>

  <!-- Status indicator -->

  <text x="400" y="1385" class="text-primary" font-size="12" font-weight="600">Product</text>
  <text x="400" y="1410" class="text-tertiary" font-size="12">Features</text>
  <text x="400" y="1430" class="text-tertiary" font-size="12">Pricing</text>
  <text x="400" y="1450" class="text-tertiary" font-size="12">Integrations</text>
  <text x="400" y="1470" class="text-tertiary" font-size="12">Changelog</text>

  <!-- Company -->
  <text x="600" y="1385" class="text-primary" font-size="12" font-weight="600">Company</text>
  <text x="600" y="1410" class="text-tertiary" font-size="12">About</text>
  <text x="600" y="1430" class="text-tertiary" font-size="12">Blog</text>
  <text x="600" y="1450" class="text-tertiary" font-size="12">Careers</text>
  <text x="600" y="1470" class="text-tertiary" font-size="12">Contact</text>

  <!-- Legal -->
  <text x="800" y="1385" class="text-primary" font-size="12" font-weight="600">Legal</text>
  <text x="800" y="1410" class="text-tertiary" font-size="12">Privacy</text>
  <text x="800" y="1430" class="text-tertiary" font-size="12">Terms</text>
  <text x="800" y="1450" class="text-tertiary" font-size="12">Security</text>
  <text x="800" y="1470" class="text-tertiary" font-size="12">Cookies</text>


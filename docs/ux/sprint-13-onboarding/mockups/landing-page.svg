  <rect x="420" y="330" width="160" height="44" rx="8" fill="#3B82F6"/>
  <text x="500" y="358" text-anchor="middle" class="text-inverse" font-size="14" font-weight="600">Get Started →</text>
  <rect x="600" y="330" width="160" height="44" rx="8" stroke="#E2E8F0" stroke-width="1" fill="#FFFFFF"/>
  <text x="680" y="358" text-anchor="middle" class="text-primary" font-size="14" font-weight="500">Watch Demo</text>


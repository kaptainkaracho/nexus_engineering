<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .bg-secondary { fill: #F8FAFC; }
      .bg-card { fill: #FFFFFF; }
      .bg-primary-50 { fill: #EFF6FF; }
      .bg-primary-500 { fill: #3B82F6; }
      .bg-border { fill: #E2E8F0; }
      .bg-success-50 { fill: #F0FDF4; }
      .bg-success-500 { fill: #22C55E; }
      .text-primary { fill: #0F172A; }
      .text-secondary { fill: #475569; }
      .text-tertiary { fill: #94A3B8; }
      .text-inverse { fill: #FFFFFF; }
      .text-primary-500 { fill: #3B82F6; }
      .text-primary-700 { fill: #1D4ED8; }
      .stroke-border { stroke: #E2E8F0; }
      .stroke-primary-500 { stroke: #3B82F6; }
    </style>
  </defs>

  <!-- Screen 1: Welcome -->
  <rect x="0" y="0" width="1200" height="450" class="bg-secondary" rx="8"/>
  <rect x="100" y="20" width="1000" height="410" class="bg-card" rx="12" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Progress: Step 1 of 4 -->
  <circle cx="300" cy="55" r="14" class="bg-primary-500"/>
  <text x="300" y="59" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">1</text>
  <line x1="320" y1="55" x2="360" y2="55" class="stroke-border" stroke-width="2"/>
  <circle cx="380" cy="55" r="14" class="bg-card" stroke="#E2E8F0" stroke-width="2"/>
  <text x="380" y="59" text-anchor="middle" class="text-tertiary" font-size="12" font-weight="600">2</text>
  <line x1="400" y1="55" x2="440" y2="55" class="stroke-border" stroke-width="2"/>
  <circle cx="460" cy="55" r="14" class="bg-card" stroke="#E2E8F0" stroke-width="2"/>
  <text x="460" y="59" text-anchor="middle" class="text-tertiary" font-size="12" font-weight="600">3</text>
  <line x1="480" y1="55" x2="520" y2="55" class="stroke-border" stroke-width="2"/>
  <circle cx="540" cy="55" r="14" class="bg-card" stroke="#E2E8F0" stroke-width="2"/>
  <text x="540" y="59" text-anchor="middle" class="text-tertiary" font-size="12" font-weight="600">4</text>
  <text x="420" y="80" text-anchor="middle" class="text-tertiary" font-size="11">Step 1 of 4 — Welcome</text>

  <!-- Skip button -->
  <text x="1020" y="40" class="text-primary-500" font-size="13" font-weight="500">Skip →</text>

  <!-- Welcome content -->
  <rect x="450" y="110" width="64" height="64" class="bg-primary-50" rx="16"/>
  <text x="482" y="149" text-anchor="middle" class="text-primary-500" font-size="28" font-weight="700">N</text>

  <text x="600" y="210" text-anchor="middle" class="text-primary" font-size="26" font-weight="700">Welcome to Nexus</text>
  <text x="600" y="240" text-anchor="middle" class="text-secondary" font-size="14">Your engineering intelligence platform. Connect your tools,</text>
  <text x="600" y="258" text-anchor="middle" class="text-secondary" font-size="14">discover patterns, and ship with confidence.</text>

  <rect x="400" y="290" width="400" height="44" class="bg-primary-500" rx="8"/>
  <text x="600" y="318" text-anchor="middle" class="text-inverse" font-size="15" font-weight="600">Get Started →</text>

  <text x="600" y="370" text-anchor="middle" class="text-primary-500" font-size="13">Already set up? Sign in</text>

  <!-- Back/Next -->
  <text x="160" y="405" class="text-tertiary" font-size="13">Back</text>
  <rect x="1000" y="390" width="80" height="36" class="bg-primary-500" rx="8"/>
  <text x="1040" y="413" text-anchor="middle" class="text-inverse" font-size="13" font-weight="600">Next →</text>

  <!-- Screen label -->
  <text x="80" y="440" class="text-tertiary" font-size="11">Screen: Welcome (Step 1 of 4)</text>

  <!-- Screen 2: Profile -->
  <rect x="0" y="460" width="1200" height="440" class="bg-secondary" rx="8"/>
  <rect x="100" y="480" width="1000" height="400" class="bg-card" rx="12" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Progress: Step 2 of 4 -->
  <circle cx="300" cy="515" r="14" class="bg-success-500"/>
  <text x="300" y="519" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">✓</text>
  <line x1="320" y1="515" x2="360" y2="515" class="stroke-primary-500" stroke-width="2"/>
  <circle cx="380" cy="515" r="14" class="bg-primary-50" stroke="#3B82F6" stroke-width="2"/>
  <text x="380" y="519" text-anchor="middle" class="text-primary-700" font-size="12" font-weight="600">2</text>
  <line x1="400" y1="515" x2="440" y2="515" class="stroke-border" stroke-width="2"/>
  <circle cx="460" cy="515" r="14" class="bg-card" stroke="#E2E8F0" stroke-width="2"/>
  <text x="460" y="519" text-anchor="middle" class="text-tertiary" font-size="12" font-weight="600">3</text>
  <line x1="480" y1="515" x2="520" y2="515" class="stroke-border" stroke-width="2"/>
  <circle cx="540" cy="515" r="14" class="bg-card" stroke="#E2E8F0" stroke-width="2"/>
  <text x="540" y="519" text-anchor="middle" class="text-tertiary" font-size="12" font-weight="600">4</text>
  <text x="420" y="540" text-anchor="middle" class="text-tertiary" font-size="11">Step 2 of 4 — Profile Setup</text>

  <text x="160" y="565" class="text-primary" font-size="20" font-weight="600">Set up your profile</text>
  <text x="160" y="585" class="text-secondary" font-size="13">Tell us about yourself</text>

  <!-- Name field -->
  <text x="160" y="620" class="text-primary" font-size="13" font-weight="500">Display name</text>
  <rect x="160" y="628" width="400" height="38" class="bg-card" rx="6" stroke="#E2E8F0" stroke-width="1"/>
  <text x="170" y="652" class="text-tertiary" font-size="13">Jane Smith</text>

  <!-- Role selector -->
  <text x="160" y="695" class="text-primary" font-size="13" font-weight="500">What best describes you?</text>
  <rect x="160" y="705" width="400" height="34" rx="6" stroke="#3B82F6" stroke-width="2" fill="#EFF6FF"/>
  <circle cx="180" cy="722" r="7" fill="#3B82F6"/>
  <text x="200" y="727" class="text-primary" font-size="13">Developer</text>

  <rect x="160" y="740" width="400" height="34" rx="6" stroke="#E2E8F0" stroke-width="1" fill="#FFFFFF"/>
  <circle cx="180" cy="757" r="7" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <text x="200" y="762" class="text-secondary" font-size="13">Engineering Manager</text>

  <rect x="160" y="775" width="400" height="34" rx="6" stroke="#E2E8F0" stroke-width="1" fill="#FFFFFF"/>
  <circle cx="180" cy="792" r="7" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <text x="200" y="797" class="text-secondary" font-size="13">Product Manager</text>

  <!-- Avatar -->
  <text x="660" y="695" class="text-primary" font-size="13" font-weight="500">Avatar — optional</text>
  <rect x="660" y="705" width="48" height="48" rx="24" fill="#DBEAFE"/>
  <text x="684" y="735" text-anchor="middle" class="text-primary-500" font-size="14" font-weight="600">JS</text>
  <rect x="720" y="710" width="120" height="36" rx="6" stroke="#E2E8F0" stroke-width="1" fill="#FFFFFF"/>
  <text x="735" y="733" class="text-secondary" font-size="12">Upload photo</text>

  <!-- Back/Next -->
  <text x="160" y="855" class="text-tertiary" font-size="13">← Back</text>
  <rect x="1000" y="838" width="80" height="36" class="bg-primary-500" rx="8"/>
  <text x="1040" y="861" text-anchor="middle" class="text-inverse" font-size="13" font-weight="600">Next →</text>

  <text x="80" y="890" class="text-tertiary" font-size="11">Screen: Profile Setup (Step 2 of 4)</text>

  <!-- Screen 3: Project -->
  <rect x="0" y="910" width="1200" height="460" class="bg-secondary" rx="8"/>
  <rect x="100" y="930" width="1000" height="420" class="bg-card" rx="12" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Progress: Step 3 of 4 -->
  <circle cx="300" cy="965" r="14" class="bg-success-500"/>
  <text x="300" y="969" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">✓</text>
  <line x1="320" y1="965" x2="360" y2="965" class="stroke-primary-500" stroke-width="2"/>
  <circle cx="380" cy="965" r="14" class="bg-success-500"/>
  <text x="380" y="969" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">✓</text>
  <line x1="400" y1="965" x2="440" y2="965" class="stroke-primary-500" stroke-width="2"/>
  <circle cx="460" cy="965" r="14" class="bg-primary-50" stroke="#3B82F6" stroke-width="2"/>
  <text x="460" y="969" text-anchor="middle" class="text-primary-700" font-size="12" font-weight="600">3</text>
  <line x1="480" y1="965" x2="520" y2="965" class="stroke-border" stroke-width="2"/>
  <circle cx="540" cy="965" r="14" class="bg-card" stroke="#E2E8F0" stroke-width="2"/>
  <text x="540" y="969" text-anchor="middle" class="text-tertiary" font-size="12" font-weight="600">4</text>
  <text x="420" y="990" text-anchor="middle" class="text-tertiary" font-size="11">Step 3 of 4 — First Project</text>

  <text x="160" y="1020" class="text-primary" font-size="20" font-weight="600">Your first project</text>
  <text x="160" y="1040" class="text-secondary" font-size="13">Let's get some data in Nexus</text>

  <!-- Demo project card -->
  <rect x="160" y="1060" width="440" height="140" rx="10" stroke="#3B82F6" stroke-width="2" fill="#FFFFFF"/>
  <rect x="180" y="1080" width="48" height="48" rx="12" fill="#EFF6FF"/>
  <text x="204" y="1110" text-anchor="middle" class="text-primary-500" font-size="20">🚀</text>
  <text x="245" y="1100" class="text-primary" font-size="15" font-weight="600">Explore Demo Project</text>
  <text x="245" y="1118" class="text-secondary" font-size="12">See Nexus in action with a pre-built demo project</text>
  <rect x="245" y="1135" width="160" height="34" rx="6" fill="#3B82F6"/>
  <text x="325" y="1157" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">Import demo →</text>

  <!-- Create blank card -->
  <rect x="620" y="1060" width="440" height="140" rx="10" stroke="#E2E8F0" stroke-width="1" fill="#FFFFFF"/>
  <rect x="640" y="1080" width="48" height="48" rx="12" fill="#EFF6FF"/>
  <text x="664" y="1110" text-anchor="middle" class="text-primary-500" font-size="20">+</text>
  <text x="705" y="1100" class="text-primary" font-size="15" font-weight="600">Create Blank Project</text>
  <text x="705" y="1118" class="text-secondary" font-size="12">Start from scratch with an empty project</text>
  <rect x="705" y="1135" width="160" height="34" rx="6" stroke="#E2E8F0" stroke-width="1" fill="#FFFFFF"/>
  <text x="785" y="1157" text-anchor="middle" class="text-secondary" font-size="12" font-weight="500">Create blank →</text>

  <text x="160" y="1250" class="text-secondary" font-size="12">Also: Connect your repo — Link a GitHub/GitLab repository to automatically import data.</text>

  <!-- Back/Next -->
  <text x="160" y="1325" class="text-tertiary" font-size="13">← Back</text>
  <rect x="1000" y="1308" width="80" height="36" class="bg-primary-500" rx="8"/>
  <text x="1040" y="1331" text-anchor="middle" class="text-inverse" font-size="13" font-weight="600">Next →</text>

  <text x="80" y="1360" class="text-tertiary" font-size="11">Screen: First Project (Step 3 of 4)</text>

  <!-- Screen 4: Tour -->
  <rect x="0" y="1380" width="1200" height="440" class="bg-secondary" rx="8"/>
  <rect x="100" y="1400" width="1000" height="400" class="bg-card" rx="12" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Progress: Step 4 of 4 -->
  <circle cx="300" cy="1435" r="14" class="bg-success-500"/>
  <text x="300" y="1439" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">✓</text>
  <line x1="320" y1="1435" x2="360" y2="1435" class="stroke-primary-500" stroke-width="2"/>
  <circle cx="380" cy="1435" r="14" class="bg-success-500"/>
  <text x="380" y="1439" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">✓</text>
  <line x1="400" y1="1435" x2="440" y2="1435" class="stroke-primary-500" stroke-width="2"/>
  <circle cx="460" cy="1435" r="14" class="bg-success-500"/>
  <text x="460" y="1439" text-anchor="middle" class="text-inverse" font-size="12" font-weight="600">✓</text>
  <line x1="480" y1="1435" x2="520" y2="1435" class="stroke-primary-500" stroke-width="2"/>
  <circle cx="540" cy="1435" r="14" class="bg-primary-50" stroke="#3B82F6" stroke-width="2"/>
  <text x="540" y="1439" text-anchor="middle" class="text-primary-700" font-size="12" font-weight="600">4</text>
  <text x="420" y="1460" text-anchor="middle" class="text-tertiary" font-size="11">Step 4 of 4 — Quick Tour</text>

  <text x="160" y="1490" class="text-primary" font-size="20" font-weight="600">You're all set!</text>
  <text x="160" y="1510" class="text-secondary" font-size="13">Here's a quick tour of your workspace:</text>

  <!-- Tour items -->
  <rect x="160" y="1530" width="860" height="50" rx="8" fill="#F8FAFC"/>
  <circle cx="180" cy="1555" r="16" fill="#EFF6FF"/>
  <text x="180" y="1559" text-anchor="middle" class="text-primary-700" font-size="13" font-weight="600">1</text>
  <text x="210" y="1548" class="text-primary" font-size="13" font-weight="600">Dashboard</text>
  <text x="210" y="1565" class="text-secondary" font-size="12">View your engineering metrics and recent activity</text>

  <rect x="160" y="1585" width="860" height="50" rx="8" fill="#F8FAFC"/>
  <circle cx="180" cy="1610" r="16" fill="#EFF6FF"/>
  <text x="180" y="1614" text-anchor="middle" class="text-primary-700" font-size="13" font-weight="600">2</text>
  <text x="210" y="1603" class="text-primary" font-size="13" font-weight="600">Discovery</text>
  <text x="210" y="1620" class="text-secondary" font-size="12">Search and browse artifacts across connected sources</text>

  <rect x="160" y="1640" width="860" height="50" rx="8" fill="#F8FAFC"/>
  <circle cx="180" cy="1665" r="16" fill="#EFF6FF"/>
  <text x="180" y="1669" text-anchor="middle" class="text-primary-700" font-size="13" font-weight="600">3</text>
  <text x="210" y="1658" class="text-primary" font-size="13" font-weight="600">Projects</text>
  <text x="210" y="1675" class="text-secondary" font-size="12">Manage requirements, features, and traceability</text>

  <rect x="160" y="1695" width="860" height="50" rx="8" fill="#F8FAFC"/>
  <circle cx="180" cy="1720" r="16" fill="#EFF6FF"/>
  <text x="180" y="1724" text-anchor="middle" class="text-primary-700" font-size="13" font-weight="600">4</text>
  <text x="210" y="1713" class="text-primary" font-size="13" font-weight="600">Settings</text>
  <text x="210" y="1730" class="text-secondary" font-size="12">Configure your org, integrations, and team members</text>

  <text x="160" y="1760" class="text-tertiary" font-size="11">Tip: You can replay this tour anytime from the Help menu.</text>

  <!-- Back/Next -->
  <text x="160" y="1780" class="text-tertiary" font-size="13">← Back</text>
  <rect x="880" y="1765" width="200" height="36" class="bg-primary-500" rx="8"/>
  <text x="980" y="1788" text-anchor="middle" class="text-inverse" font-size="13" font-weight="600">Start using Nexus →</text>

  <text x="80" y="1815" class="text-tertiary" font-size="11">Screen: Quick Tour (Step 4 of 4)</text>
</svg>

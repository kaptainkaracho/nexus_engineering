requirements:
  - id: REQ-AUTH-001
    type: functional
    title: User Login
    description: |
      Users MUST be able to log in with email and password.
      Sessions expire after 15 minutes of inactivity.
    priority: high
    status: approved
    tags:
      - auth
      - security
    acceptanceCriteria:
      - "Given a registered user, when valid credentials are entered, then a session is created"
      - "Given a user, when invalid credentials are entered, then an error message is shown"
    dependencies: []
    relatedIssues: []
    notes: |
      Password hashing uses Argon2id.

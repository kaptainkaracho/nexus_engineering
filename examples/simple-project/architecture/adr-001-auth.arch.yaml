adr:
  id: ADR-001
  title: Use JWT for session management
  status: accepted
  context: |
    We need a stateless authentication mechanism that works across
    multiple services without shared session storage.
  decision: |
    Use short-lived JWT access tokens (15 minutes) signed with RS256.
    Refresh tokens rotate on each use and are stored server-side.
  consequences:
    - Services can validate tokens locally without network calls
    - Revocation has up to 15-minute window for access tokens
    - Refresh token store (Redis) required for revocation

adr:
  id: ADR-003
  title: Use Stripe for payment processing
  status: accepted
  context: |
    We need PCI-compliant payment processing without handling card data
    directly. Building custom payment infrastructure is complex and risky.
  decision: |
    Integrate Stripe as the payment processor. Use Stripe Elements for
    frontend card input and Stripe API for backend payment processing.
  consequences:
    - PCI compliance handled by Stripe
    - Support for multiple payment methods (cards, wallets, BNPL)
    - Webhook-based payment status updates
    - Transaction fees per payment (2.9% + $0.30)

nexus:
  schema: req-doc/v1
  metadata:
    domain: Artifact Registry
    version: 1.0.0
    source: examples/tac-samples/requirements/artifact-registry.req.yaml
    documentId: TAC-DEMO-ARTIFACT
    author: BackendArchitect
    createdAt: "2026-07-19"
    updatedAt: "2026-07-19"

requirements:
  - id: REQ-ART-001
    type: functional
    title: Artifact Upload and Integrity
    description: |
      Users MUST be able to upload build artifacts. Each artifact MUST be
      stored with a content hash (sha256) and verified on upload to prevent
      corruption and duplicate storage.
    priority: critical
    status: approved
    tags:
      - artifact
      - storage
    acceptanceCriteria:
      - "Given a valid artifact upload, when stored, then its sha256 is recorded and deduplicated"
      - "Given an upload whose hash mismatches, when validated, then the upload is rejected"
    dependencies: []
    relatedIssues:
      - THE-203
    notes: |
      S3-compatible object store backs the registry.

  - id: REQ-ART-002
    type: functional
    title: Artifact Metadata and Versioning
    description: |
      Each artifact MUST carry metadata (name, version, build id, repo)
      and support immutable versioned addressing.
    priority: high
    status: approved
    tags:
      - artifact
      - metadata
    acceptanceCriteria:
      - "Given an artifact, when published, then it is addressable by name@version"
      - "Given an existing version, when re-published, then the write is rejected (immutability)"
    dependencies:
      - REQ-ART-001
    relatedIssues: []
    notes: |
      Metadata is indexed in Postgres for fast lookup.

  - id: REQ-ART-003
    type: non-functional
    title: Artifact Download Authorization
    description: |
      Artifact downloads MUST be authorized per-tenant and scoped by role.
      Public artifacts MAY be served via signed, expiring URLs.
    priority: high
    status: proposed
    tags:
      - artifact
      - security
    acceptanceCriteria:
      - "Given a user without read role, when downloading a private artifact, then access is denied"
      - "Given a public artifact, when requested, then a signed URL with a 5-minute expiry is issued"
    dependencies:
      - REQ-ART-001
    relatedIssues: []
    notes: |
      Signed URLs are generated by the shared auth gateway.

name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install mkdocs-material mkdocs-mermaid-plugin

      - name: Setup MkDocs config
        run: |
          if [ ! -f mkdocs.yml ]; then
            cat > mkdocs.yml <<'EOF'
          site_name: Nexus Engineering Documentation
          site_description: Engineering as Code traceability platform documentation
          theme:
            name: material
            palette:
              - scheme: default
                primary: indigo
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - scheme: slate
                primary: indigo
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          plugins:
            - search
            - mermaid2
          markdown_extensions:
            - admonition
            - pymdownx.details
            - pymdownx.superfences
          nav:
            - Home: INDEX.md
            - User Guide: USER_GUIDE.md
            - API Reference: API_REFERENCE.md
            - Architecture: ARCHITECTURE.md
            - Developer Guide: DEVELOPER_GUIDE.md
            - Deployment: DEPLOYMENT.md
          EOF
          fi

      - name: Build site
        run: mkdocs build --strict || mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

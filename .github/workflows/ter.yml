name: TER Generation

# CI integration for Test Execution Results as Code (THE-229 / Epic A).
# Converts Vitest + Playwright JSON output into results-doc/v1 TER YAML and
# uploads it as a downloadable artifact. Runs best-effort so it never blocks
# the primary CI pipeline.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  generate-ter:
    name: Generate TER artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest JSON)
        run: pnpm test -- --reporter=json --outputFile=test-results/vitest.json || true

      - name: Convert Vitest results to TER
        run: node scripts/ter-reporter-vitest.mjs --input test-results/vitest.json --out artifacts/unit.ter.yaml
        continue-on-error: true

      - name: Convert Playwright results to TER (if present)
        run: node scripts/ter-from-playwright.mjs --input test-results/playwright.json --out artifacts/e2e.ter.yaml
        continue-on-error: true

      - name: Upload TER artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ter-results
          path: artifacts/*.ter.yaml
          if-no-files-found: ignore

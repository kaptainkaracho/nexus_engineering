# Railway project configuration for Nexus Engineering.
# Single Nixpacks service at the repo root: the pnpm workspace cannot resolve
# per-app build roots, so the backend (Fastify) serves the built frontend SPA
# from the same origin. See DEPLOYMENT.md for the full runbook.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @nexus-engineering/frontend build"

[deploy]
startCommand = "tsx apps/backend/src/index.ts"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Require a persistent volume so the SQLite databases survive deploys/restarts.
requiredMountPath = "/data"

[variables]
NODE_ENV = "production"
NODE_VERSION = "20"
DATABASE_PATH = "/data/nexus.db"
